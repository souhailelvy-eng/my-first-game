<h1>🎮 لعبة الضغط</h1>

<h2>النقاط: <span id="score">0</span></h2>

<h2>المستوى: <span id="level">1</span></h2>

<button id="clickBtn" onclick="addPoint()">
اضغط هنا!
</button>

<br>

<button id="resetBtn" onclick="resetGame()">
إعادة اللعب
</button>

<h2 id="message">ابدأ اللعب!</h2>

<script>

let score = 0;
let level = 1;

function addPoint() {

  score++;

  level = Math.floor(score / 10) + 1;

  document.getElementById("score").innerText = score;

  document.getElementById("level").innerText = level;

  if (score >= 100) {
    document.getElementById("message").innerText =
    "🏆 مبروك! لقد فزت!";
  }

  else if (score % 10 === 0) {
    document.getElementById("message").innerText =
    "🎉 انتقلت إلى مستوى جديد!";
  }

  else {
    document.getElementById("message").innerText =
    "استمر! أنت رائع!";
  }

}

function resetGame() {

  score = 0;
  level = 1;

  document.getElementById("score").innerText = 0;
  document.getElementById("level").innerText = 1;

  document.getElementById("message").innerText =
  "ابدأ اللعب من جديد!";

}

</script>
